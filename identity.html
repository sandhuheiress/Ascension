<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ascension: Name your guild</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<h1 class="title">Ascension: Hunter's Tower</h1>
<p class="subtitle">Digital prototype &middot; play locally vs AI, or live online with friends</p>

<div id="screenIdentity" class="glass card">
  <h2>Name your guild</h2>
  <p class="desc">Pick a name and a color for your guild.</p>
  <input class="textin" id="identityName" style="width:220px;" maxlength="18" placeholder="Guild name">
  <div class="colorGrid" id="colorGrid"></div>
  <div class="err" id="identityErr"></div>
  <div class="btnRow">
    <button class="ghost-btn" id="btnBackFromIdentity">Back</button>
    <button class="glow-btn" id="btnIdentityGo">Next</button>
  </div>
</div>

<script type="module" src="js/pages/identity.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ascension: Waiting room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<h1 class="title">Ascension: Hunter's Tower</h1>
<p class="subtitle">Digital prototype &middot; play locally vs AI, or live online with friends</p>

<div id="screenLobby" class="glass card">
  <h2>Waiting room</h2>
  <p class="desc">Room code, share this with the rest of the party.</p>
  <div class="codeShow" id="lobbyCode"></div>
  <div class="slotRow" id="lobbySlots"></div>
  <div class="btnRow">
    <button class="ghost-btn" id="btnAddBot">Fill a seat with AI</button>
  </div>
  <button class="glow-btn" style="margin-top:14px;" id="btnStartGame">Start game</button>
  <p class="desc" style="margin-top:10px;font-size:11.5px;" id="lobbyHint"></p>
  <div><button class="ghost-btn" style="margin-top:6px;" id="btnLeaveLobby">Leave room</button></div>
</div>

<script type="module" src="js/pages/lobby.js"></script>
</body>
</html>

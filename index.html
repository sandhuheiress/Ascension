<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ascension: Hunter's Tower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<h1 class="title">Ascension: Hunter's Tower</h1>
<p class="subtitle">Digital prototype &middot; play locally vs AI, or live online with friends</p>

<div id="screenHome" style="max-width:480px;margin:0 auto;">
  <div style="text-align:center;margin-bottom:14px;">
    <button class="howBtn" id="btnHowToHome">How to play</button>
  </div>
  <div class="modeToggle">
    <button class="modeBtn sel" id="modeLocalBtn">Local game</button>
    <button class="modeBtn" id="modeOnlineBtn">Online room</button>
  </div>

  <div id="homeLocalPanel" class="glass card">
    <h2>Play vs AI</h2>
    <p class="desc">Solo test the game functions against computer-controlled guilds, all on this device.</p>
    <div class="count-row" id="localCountRow"></div>
    <button class="glow-btn" id="btnLocalNext">Next</button>
  </div>

  <div id="homeOnlinePanel" class="glass card" style="display:none;">
    <h2>Play online</h2>
    <p class="desc">Host a new expedition, or join one already in progress with a room code.</p>
    <div class="btnRow">
      <button class="glow-btn" id="btnGoCreate">Host a new game</button>
      <button class="ghost-btn" id="btnGoJoin">Join a game</button>
    </div>
  </div>
</div>

<script type="module" src="js/pages/home.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ascension: Hunter's Tower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="in-game">

<div id="game">
  <div class="gameHead">
    <span class="roomTag" id="roomTag"></span>
    <div style="display:flex; align-items:center; gap:10px;">
      <div class="avatarRow" id="headerAvatars"></div>
      <button class="howBtn" id="btnHowToGame">How to play</button>
      <button class="leaveBtn" id="btnLeaveGame">Leave game</button>
    </div>
  </div>

  <div class="layout">
    <div class="towerPanel glass">
      <h3>The Tower</h3>
      <div id="outbreakBadge" class="outbreakBadge"></div>
      <div id="towerList"></div>
    </div>

    <div class="mainCol">
      <div class="turnBanner glass" id="turnBanner"></div>
      <div id="winBanner" class="glass" style="display:none; padding:12px 18px; margin-bottom:14px; color:var(--gold); font-weight:600;"></div>
      <div id="tradeOfferBanner" class="glass"></div>
      <div id="diceReveal" class="glass"></div>

      <div class="floorCard">
        <h2 id="floorTitle"></h2>
        <p id="floorSub"></p>
      </div>

      <div class="arena" id="arena"></div>

      <div id="myPlacemat" class="placemat glass">
        <h4>Your Supplies</h4>
        <div class="placematCols">
          <div class="placematCol">
            <div class="pmLabel">Materials</div>
            <div class="matRow" id="placematMats"></div>
          </div>
          <div class="placematCol gearCol">
            <div class="pmLabel">Gear</div>
            <div class="matRow" id="placematGear"></div>
          </div>
        </div>
      </div>

      <div class="actionBar">
        <button class="act" id="btnHunt"><span class="lbl">Hunt</span><span class="sub" id="huntSub">1 AP</span></button>
        <button class="act" id="btnTrain"><span class="lbl">Train</span><span class="sub" id="trainSub">1 AP</span></button>
        <button class="act raid" id="btnRaid"><span class="lbl">Raid</span><span class="sub">1 AP, d6 4+ steals</span></button>
        <button class="act trade" id="btnTradeToggle"><span class="lbl">Trade</span><span class="sub">Propose a swap</span></button>
        <button class="act raid" id="btnSabotageToggle"><span class="lbl">Sabotage</span><span class="sub">1 AP, curse a rival</span></button>
        <button class="act" id="btnBlacksmithToggle"><span class="lbl">Blacksmith</span><span class="sub">Craft or upgrade gear</span></button>
        <button class="act" id="btnTransmute"><span class="lbl">Transmute</span><span class="sub" id="transmuteSub">give &rarr; receive 1</span></button>
      </div>

      <div class="ascendRow">
        <button class="act ascend" id="btnAscend"><span class="lbl">&#x2B06;&#xFE0F; Ascend</span><span class="sub" id="ascendSub">pay the toll</span></button>
      </div>

      <button class="act end" id="btnEndTurn"><span class="lbl">End turn</span></button>

      <div class="panelInline glass" id="tradePanel">
        <div class="row">
          <div class="field"><label>Target</label><select id="tradeTarget"></select></div>
          <div class="field"><label>You give</label><select id="tradeGiveMat"></select></div>
          <div class="field"><label>Qty</label><select id="tradeGiveQty"></select></div>
          <div class="field"><label>You want</label><select id="tradeWantMat"></select></div>
          <div class="field"><label>Qty</label><select id="tradeWantQty"></select></div>
        </div>
        <div class="submitRow">
          <button class="act trade" id="btnSendTrade">Send offer</button>
          <button class="act" id="btnCancelTrade">Cancel</button>
        </div>
      </div>

      <div class="panelInline glass" id="sabotagePanel">
        <div class="row">
          <div class="field"><label>Target</label><select id="sabTarget"></select></div>
          <div class="field"><label>Pay with</label><select id="sabMat"></select></div>
        </div>
        <div class="submitRow">
          <button class="act raid" id="btnSendSabotage">Cast curse</button>
          <button class="act" id="btnCancelSabotage">Cancel</button>
        </div>
      </div>

      <div class="panelInline glass" id="blacksmithPanel">
        <div class="row">
          <div class="field" style="flex:1 1 100%;"><label>Craft or upgrade</label><select id="blacksmithItem"></select></div>
        </div>
        <p class="line" id="blacksmithCost" style="font-size:11.5px;color:var(--text-mid);margin:6px 0 0;"></p>
        <div class="submitRow">
          <button class="act" id="btnCraftItem">Craft</button>
          <button class="act" id="btnCancelBlacksmith">Cancel</button>
        </div>
      </div>

    </div>

    <div class="logPanel glass">
      <h3>Activity Log</h3>
      <div id="log"></div>
    </div>
  </div>
</div>

<script type="module" src="js/pages/game.js"></script>
</body>
</html>
